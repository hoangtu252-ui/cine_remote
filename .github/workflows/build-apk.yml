name: Build Cine Remote APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Android SDK 34
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "build-tools;30.0.3"

      # --------------------------------------------------
      # 5. Flutter dependencies
      # --------------------------------------------------
      - name: Flutter Pub Get
        run: |
          flutter clean
          flutter pub get

      # --------------------------------------------------
      # 6. Remove Firebase Gradle plugins
      # --------------------------------------------------
      - name: Remove Firebase Gradle plugins
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          s = p.read_text()

          # Kotlin
          s = s.replace(
              "ext.kotlin_version = '1.6.10'",
              "ext.kotlin_version = '1.7.10'"
          )

          # Remove Firebase Google Services
          s = s.replace(
              "        classpath 'com.google.gms:google-services:4.3.10'\n",
              ""
          )

          # Remove Firebase Crashlytics
          s = s.replace(
              "        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.8.1'\n",
              ""
          )

          p.write_text(s)

          # ------------------------------------------------
          # app/build.gradle
          # ------------------------------------------------
          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Remove Firebase plugins
          s = s.replace(
              "apply plugin: 'com.google.gms.google-services'\n",
              ""
          )

          s = s.replace(
              "apply plugin: 'com.google.firebase.crashlytics'\n",
              ""
          )

          # Force compile SDK 34
          s = s.replace(
              "compileSdkVersion flutter.compileSdkVersion",
              "compileSdkVersion 34"
          )

          # Make target SDK explicit
          s = s.replace(
              "targetSdkVersion flutter.targetSdkVersion",
              "targetSdkVersion 34"
          )

          p.write_text(s)
          PY

      # --------------------------------------------------
      # 7. Remove Firebase initialization from dependencies
      # --------------------------------------------------
      - name: Disable Firebase runtime initialization
        shell: bash
        run: |
          set -e

          if [ -f lib/dependencies.dart ]; then
            python3 <<'PY'
          from pathlib import Path

          p = Path("lib/dependencies.dart")
          s = p.read_text()

          # Remove Firebase imports
          lines = []
          for line in s.splitlines():
              if "firebase_core" in line:
                  continue
              if "firebase_crashlytics" in line:
                  continue
              if "firebase_options.dart" in line:
                  continue
              lines.append(line)

          s = "\n".join(lines) + "\n"

          # Remove common Firebase initialization lines
          s = s.replace(
              "await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);",
              ""
          )

          s = s.replace(
              "await Firebase.initializeApp();",
              ""
          )

          s = s.replace(
              "Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);",
              ""
          )

          # Remove common Crashlytics setup
          s = s.replace(
              "FlutterError.onError = FirebaseCrashlytics.instance.recordFlutterFatalError;",
              ""
          )

          p.write_text(s)
          PY
          fi

      # --------------------------------------------------
      # 8. Create Gradle 7.4 wrapper
      # --------------------------------------------------
      - name: Create Gradle 7.4 wrapper
        shell: bash
        run: |
          set -e

          cd android

          if [ ! -f gradlew ]; then
            echo "gradlew missing - creating Gradle 7.4 wrapper"

            cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.4-all.zip
          EOF

            curl -fsSL \
              https://raw.githubusercontent.com/gradle/gradle/v7.4.2/gradlew \
              -o gradlew

            chmod +x gradlew

            curl -fsSL \
              https://raw.githubusercontent.com/gradle/gradle/v7.4.2/gradlew.bat \
              -o gradlew.bat
          fi

          chmod +x gradlew

          ./gradlew --version

      # --------------------------------------------------
      # 9. Verify configuration
      # --------------------------------------------------
      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "===== Gradle ====="
          cd android
          ./gradlew --version

          echo
          echo "===== compileSdk ====="
          grep -n "compileSdkVersion" app/build.gradle || true

          echo
          echo "===== targetSdk ====="
          grep -n "targetSdkVersion" app/build.gradle || true

          echo
          echo "===== Firebase Gradle plugins ====="
          grep -n "google-services\|crashlytics" build.gradle app/build.gradle || true

      # --------------------------------------------------
      # 10. Build APK
      # --------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # --------------------------------------------------
      # 11. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "===== APK files ====="
          find android -type f -name "*.apk" -print

      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cine-remote-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
