name: Build Cine Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout source
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. Setup Flutter
      #
      # Flutter 3.27.4 = Dart 3.6.x
      # Required by build_runner 2.4.14
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ============================================================
      # 4. Check versions
      # ============================================================
      - name: Check versions
        run: |
          echo "========================================"
          echo "Flutter"
          echo "========================================"
          flutter --version

          echo "========================================"
          echo "Dart"
          echo "========================================"
          dart --version

          echo "========================================"
          echo "Java"
          echo "========================================"
          java -version

      # ============================================================
      # 5. Install Android SDK 32
      #
      # Cine Remote uses old AGP 7.1.2.
      # AGP 7.1.2 should not be used with compileSdk 35.
      # ============================================================
      - name: Setup Android SDK 32
        run: |
          echo "========================================"
          echo "Installing Android SDK 32"
          echo "========================================"

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platforms;android-32" \
            "build-tools;32.0.0"

          echo "========================================"
          echo "Installed Android SDK"
          echo "========================================"

          sdkmanager --list_installed | grep -E \
            "platforms;android-32|build-tools;32.0.0" || true

      # ============================================================
      # 6. Upgrade Kotlin
      #
      # Original project:
      # Kotlin 1.6.10
      #
      # Flutter 3.27 requires >= 1.7.0
      # ============================================================
      - name: Upgrade Kotlin version
        run: |
          echo "========================================"
          echo "Kotlin before"
          echo "========================================"

          grep -R "kotlin_version" \
            android/build.gradle || true

          sed -i \
            "s/ext.kotlin_version = '1.6.10'/ext.kotlin_version = '1.7.10'/" \
            android/build.gradle

          echo "========================================"
          echo "Kotlin after"
          echo "========================================"

          grep -R "kotlin_version" \
            android/build.gradle || true

      # ============================================================
      # 7. Fix compileSdk
      #
      # Original project uses old Android Gradle Plugin.
      # Force compileSdk to Android 32.
      # ============================================================
      - name: Fix Android compileSdk
        run: |
          echo "========================================"
          echo "Android configuration BEFORE"
          echo "========================================"

          grep -nE \
            "compileSdk|compileSdkVersion|targetSdk|minSdk" \
            android/app/build.gradle || true

          # Old Flutter project syntax
          sed -i -E \
            's/compileSdkVersion [0-9]+/compileSdkVersion 32/' \
            android/app/build.gradle || true

          # Newer syntax, if present
          sed -i -E \
            's/compileSdk [0-9]+/compileSdk 32/' \
            android/app/build.gradle || true

          echo "========================================"
          echo "Android configuration AFTER"
          echo "========================================"

          grep -nE \
            "compileSdk|compileSdkVersion|targetSdk|minSdk" \
            android/app/build.gradle || true

      # ============================================================
      # 8. Remove Firebase from Dart runtime
      #
      # Firebase is not required for camera control.
      #
      # This removes:
      # - firebase_core
      # - firebase_crashlytics
      # - firebase_options.dart dependency
      # ============================================================
      - name: Remove Firebase from Dart
        run: |
          echo "========================================"
          echo "Removing Firebase initialization"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/dependencies.dart")

          if not path.exists():
              print("lib/dependencies.dart not found")
              raise SystemExit(0)

          text = path.read_text()

          # Remove Firebase imports
          text = text.replace(
              "import 'package:firebase_core/firebase_core.dart';\n",
              ""
          )

          text = text.replace(
              "import 'package:firebase_crashlytics/firebase_crashlytics.dart';\n",
              ""
          )

          text = text.replace(
              "import 'firebase_options.dart';\n",
              ""
          )

          # Remove Firebase setup calls
          text = text.replace(
              "  await setupFirebase();\n"
              "  setupCrashReporting();\n\n",
              ""
          )

          # Remove setupFirebase()
          start = text.find(
              "Future<void> setupFirebase() async {"
          )

          if start != -1:
              end = text.find("\n}\n", start)

              if end != -1:
                  text = text[:start] + text[end + 3:]

          # Remove setupCrashReporting()
          start = text.find(
              "void setupCrashReporting() {"
          )

          if start != -1:
              end = text.find("\n}\n", start)

              if end != -1:
                  text = text[:start] + text[end + 3:]

          path.write_text(text)

          print("Firebase initialization removed.")
          PY

          echo "========================================"
          echo "Remaining Firebase references"
          echo "========================================"

          grep -nEi \
            "firebase|Firebase" \
            lib/dependencies.dart || true

      # ============================================================
      # 9. Disable Google Services Gradle plugin
      #
      # Prevents:
      #
      # processReleaseGoogleServices
      # google-services.json missing
      # ============================================================
      - name: Disable Google Services plugin
        run: |
          echo "========================================"
          echo "Google Services BEFORE"
          echo "========================================"

          grep -RniE \
            "google-services|com.google.gms" \
            android || true

          # Remove plugin application
          sed -i \
            "/com.google.gms.google-services/d" \
            android/app/build.gradle || true

          # Remove Google Services dependency
          sed -i \
            "/com.google.gms:google-services/d" \
            android/build.gradle || true

          echo "========================================"
          echo "Google Services AFTER"
          echo "========================================"

          grep -RniE \
            "google-services|com.google.gms" \
            android || true

      # ============================================================
      # 10. Flutter clean
      # ============================================================
      - name: Flutter Clean
        run: |
          flutter clean

      # ============================================================
      # 11. Get dependencies
      # ============================================================
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # ============================================================
      # 12. Verify configuration
      # ============================================================
      - name: Verify build configuration
        run: |
          echo "========================================"
          echo "compileSdk"
          echo "========================================"

          grep -nE \
            "compileSdk|compileSdkVersion" \
            android/app/build.gradle || true

          echo "========================================"
          echo "Kotlin"
          echo "========================================"

          grep -n \
            "kotlin_version" \
            android/build.gradle || true

          echo "========================================"
          echo "Firebase references"
          echo "========================================"

          grep -RniE \
            "firebase_core|firebase_crashlytics|FirebaseCrashlytics|Firebase.initializeApp|DefaultFirebaseOptions" \
            lib || true

          echo "========================================"
          echo "Google Services references"
          echo "========================================"

          grep -RniE \
            "google-services|com.google.gms" \
            android || true

      # ============================================================
      # 13. Build ARM64 APK
      #
      # Xiaomi Pad 6S Pro = ARM64
      # ============================================================
      - name: Build ARM64 APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      # ============================================================
      # 14. Prepare APK
      # ============================================================
      - name: Prepare APK
        run: |
          mkdir -p artifacts

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            artifacts/cine-remote-arm64.apk

          echo "========================================"
          echo "APK generated"
          echo "========================================"

          ls -lh \
            artifacts/cine-remote-arm64.apk

      # ============================================================
      # 15. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cine-remote-arm64
          path: artifacts/cine-remote-arm64.apk
          if-no-files-found: error
