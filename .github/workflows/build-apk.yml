name: Build Cine Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 3. Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true


      # ============================================================
      # 4. Environment
      # ============================================================
      - name: Check environment
        run: |
          echo "========================================"
          echo "Flutter"
          echo "========================================"

          flutter --version

          echo "========================================"
          echo "Dart"
          echo "========================================"

          dart --version

          echo "========================================"
          echo "Java"
          echo "========================================"

          java -version

          echo "========================================"
          echo "ANDROID_HOME"
          echo "========================================"

          echo "$ANDROID_HOME"

          echo "========================================"
          echo "ANDROID_SDK_ROOT"
          echo "========================================"

          echo "$ANDROID_SDK_ROOT"


      # ============================================================
      # 5. Install Android SDK 32
      # ============================================================
      - name: Install Android SDK 32
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "Android SDK:"
          echo "$SDK_PATH"

          if [ -x "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_PATH/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/cmdline-tools/bin/sdkmanager"
          elif [ -x "$SDK_PATH/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/tools/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager not found"
            find "$SDK_PATH" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-32" \
            "build-tools;32.0.0"

          echo "========================================"
          echo "Installed Android platforms"
          echo "========================================"

          ls -la "$SDK_PATH/platforms"


      # ============================================================
      # 6. Inspect Android build configuration
      # ============================================================
      - name: Inspect Android configuration
        run: |
          echo "========================================"
          echo "android/app/build.gradle"
          echo "========================================"

          cat android/app/build.gradle

          echo "========================================"
          echo "android/build.gradle"
          echo "========================================"

          cat android/build.gradle

          echo "========================================"
          echo "android/settings.gradle"
          echo "========================================"

          cat android/settings.gradle


      # ============================================================
      # 7. Upgrade Kotlin
      # ============================================================
      - name: Upgrade Kotlin
        run: |
          echo "Kotlin BEFORE"

          grep -R "kotlin_version" \
            android/build.gradle || true

          sed -i \
            "s/ext.kotlin_version = '1.6.10'/ext.kotlin_version = '1.7.10'/" \
            android/build.gradle

          echo "Kotlin AFTER"

          grep -R "kotlin_version" \
            android/build.gradle || true


      # ============================================================
      # 8. Force compileSdk 32
      # ============================================================
      - name: Force compileSdk 32
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              print("android/app/build.gradle not found")
              raise SystemExit(1)

          text = path.read_text()

          print("===== compileSdk BEFORE =====")

          for line in text.splitlines():
              if "compileSdk" in line:
                  print(line)

          # --------------------------------------------------------
          # Handle:
          #
          # compileSdkVersion 35
          # compileSdkVersion flutter.compileSdkVersion
          # compileSdk 35
          # compileSdk flutter.compileSdkVersion
          # --------------------------------------------------------

          text = re.sub(
              r'compileSdkVersion\s+[^\n]+',
              'compileSdkVersion 32',
              text
          )

          text = re.sub(
              r'compileSdk\s+[^\n]+',
              'compileSdk 32',
              text
          )

          path.write_text(text)

          print("===== compileSdk AFTER =====")

          for line in text.splitlines():
              if "compileSdk" in line:
                  print(line)
          PY

          echo "========================================"
          echo "Final Android configuration"
          echo "========================================"

          grep -nE \
            "compileSdk|compileSdkVersion" \
            android/app/build.gradle || true


      # ============================================================
      # 9. Verify no compileSdk 35 remains
      # ============================================================
      - name: Verify compileSdk
        run: |
          echo "Searching entire Android project..."

          grep -RniE \
            "compileSdk|compileSdkVersion" \
            android || true

          echo "========================================"
          echo "Checking for android-35 references"
          echo "========================================"

          grep -Rni \
            "35" \
            android/app/build.gradle \
            android/build.gradle \
            android/settings.gradle || true


      # ============================================================
      # 10. Remove Firebase initialization
      # ============================================================
      - name: Remove Firebase initialization
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/dependencies.dart")

          if not path.exists():
              print("dependencies.dart not found")
              raise SystemExit(0)

          text = path.read_text()

          text = text.replace(
              "import 'package:firebase_core/firebase_core.dart';\n",
              ""
          )

          text = text.replace(
              "import 'package:firebase_crashlytics/firebase_crashlytics.dart';\n",
              ""
          )

          text = text.replace(
              "import 'firebase_options.dart';\n",
              ""
          )

          text = text.replace(
              "  await setupFirebase();\n"
              "  setupCrashReporting();\n\n",
              ""
          )

          # Remove setupFirebase()
          start = text.find(
              "Future<void> setupFirebase() async {"
          )

          if start != -1:
              end = text.find("\n}\n", start)

              if end != -1:
                  text = text[:start] + text[end + 3:]

          # Remove setupCrashReporting()
          start = text.find(
              "void setupCrashReporting() {"
          )

          if start != -1:
              end = text.find("\n}\n", start)

              if end != -1:
                  text = text[:start] + text[end + 3:]

          path.write_text(text)
          PY


      # ============================================================
      # 11. Disable Google Services
      # ============================================================
      - name: Disable Google Services
        run: |
          sed -i \
            "/com.google.gms.google-services/d" \
            android/app/build.gradle || true

          sed -i \
            "/com.google.gms:google-services/d" \
            android/build.gradle || true

          echo "Remaining Google Services references:"

          grep -RniE \
            "google-services|com.google.gms" \
            android || true


      # ============================================================
      # 12. Flutter clean
      # ============================================================
      - name: Flutter Clean
        run: |
          flutter clean


      # ============================================================
      # 13. Pub get
      # ============================================================
      - name: Flutter Pub Get
        run: |
          flutter pub get


      # ============================================================
      # 14. Final verification
      # ============================================================
      - name: Final verification
        run: |
          echo "========================================"
          echo "compileSdk"
          echo "========================================"

          grep -nE \
            "compileSdk|compileSdkVersion" \
            android/app/build.gradle || true

          echo "========================================"
          echo "Kotlin"
          echo "========================================"

          grep -n \
            "kotlin_version" \
            android/build.gradle || true

          echo "========================================"
          echo "Firebase"
          echo "========================================"

          grep -RniE \
            "firebase_core|firebase_crashlytics|FirebaseCrashlytics|Firebase.initializeApp|DefaultFirebaseOptions" \
            lib || true

          echo "========================================"
          echo "Google Services"
          echo "========================================"

          grep -RniE \
            "google-services|com.google.gms" \
            android || true


      # ============================================================
      # 15. Build ARM64
      # ============================================================
      - name: Build ARM64 APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64


      # ============================================================
      # 16. Prepare APK
      # ============================================================
      - name: Prepare APK
        run: |
          mkdir -p artifacts

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            artifacts/cine-remote-arm64.apk

          ls -lh \
            artifacts/cine-remote-arm64.apk


      # ============================================================
      # 17. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cine-remote-arm64
          path: artifacts/cine-remote-arm64.apk
          if-no-files-found: error
