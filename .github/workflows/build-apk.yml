name: Build Cine Remote APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Flutter 3.27.4
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ============================================================
      # 4. Android SDK 34
      # ============================================================
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -e

          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

          echo "Android SDK 34 installed successfully."

      # ============================================================
      # 5. Flutter clean / pub get
      # ============================================================
      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      # ============================================================
      # 6. Check Gradle wrapper
      #
      # The repository does not contain android/gradlew.
      # Flutter's Android tooling may generate/update the Gradle files.
      # ============================================================
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "Checking Android directory..."

          ls -la android

          if [ ! -f android/gradlew ]; then
            echo "android/gradlew is missing."
            echo "Generating Gradle wrapper..."

            cd android

            gradle wrapper --gradle-version 7.4

            cd ..
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew could not be generated."
            exit 1
          fi

          chmod +x android/gradlew

          echo ""
          echo "Gradle wrapper:"
          ls -lh android/gradlew

      # ============================================================
      # 7. Force compileSdk 34
      # ============================================================
      - name: Force compileSdk 34
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle not found"
              )

          text = path.read_text()

          # Old Flutter syntax:
          # compileSdkVersion flutter.compileSdkVersion
          text = re.sub(
              r'(?m)^(\s*)compileSdkVersion\s+.*$',
              r'\g<1>compileSdkVersion 34',
              text
          )

          # New Gradle syntax:
          # compileSdk = flutter.compileSdkVersion
          text = re.sub(
              r'(?m)^(\s*)compileSdk\s*=\s*.*$',
              r'\g<1>compileSdk = 34',
              text
          )

          # New Gradle syntax:
          # compileSdk 35
          text = re.sub(
              r'(?m)^(\s*)compileSdk\s+\d+\s*$',
              r'\g<1>compileSdk 34',
              text
          )

          path.write_text(text)

          print("compileSdk forced to 34.")
          PY

          echo ""
          echo "========== compileSdk =========="

          grep -nE \
            "compileSdk|compileSdkVersion" \
            android/app/build.gradle

          echo ""
          echo "========== Check flutter.compileSdkVersion =========="

          if grep -n "flutter.compileSdkVersion" \
            android/app/build.gradle; then

            echo "ERROR: flutter.compileSdkVersion still exists."
            exit 1
          fi

      # ============================================================
      # 8. Remove Firebase runtime initialization
      # ============================================================
      - name: Remove Firebase runtime initialization
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/dependencies.dart")

          if not path.exists():
              print("dependencies.dart not found.")
              raise SystemExit(0)

          text = path.read_text()

          text = re.sub(
              r"import 'package:firebase_core/firebase_core\.dart';\n",
              "",
              text
          )

          text = re.sub(
              r"import 'package:firebase_crashlytics/firebase_crashlytics\.dart';\n",
              "",
              text
          )

          text = re.sub(
              r"import 'firebase_options\.dart';\n",
              "",
              text
          )

          text = re.sub(
              r"Future<void> setupFirebase\(\) async \{.*?\n\}\n",
              "",
              text,
              flags=re.S
          )

          text = re.sub(
              r"void setupCrashReporting\(\) \{.*?\n\}\n",
              "",
              text,
              flags=re.S
          )

          text = text.replace(
              "  await setupFirebase();\n",
              ""
          )

          text = text.replace(
              "  setupCrashReporting();\n",
              ""
          )

          path.write_text(text)

          print("Firebase runtime initialization removed.")
          PY

      # ============================================================
      # 9. Disable Firebase Gradle plugins
      # ============================================================
      - name: Disable Firebase Gradle plugins
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if path.exists():
              text = path.read_text()

              text = re.sub(
                  r"(?m)^\s*apply plugin:\s*['\"]com\.google\.gms\.google-services['\"]\s*\n?",
                  "",
                  text
              )

              text = re.sub(
                  r"(?m)^\s*apply plugin:\s*['\"]com\.google\.firebase\.crashlytics['\"]\s*\n?",
                  "",
                  text
              )

              path.write_text(text)

          path = Path("android/build.gradle")

          if path.exists():
              text = path.read_text()

              text = re.sub(
                  r"(?m)^\s*classpath\s+['\"]com\.google\.gms:google-services:[^'\"]+['\"]\s*\n?",
                  "",
                  text
              )

              text = re.sub(
                  r"(?m)^\s*classpath\s+['\"]com\.google\.firebase:firebase-crashlytics-gradle:[^'\"]+['\"]\s*\n?",
                  "",
                  text
              )

              path.write_text(text)

          print("Firebase Gradle plugins disabled.")
          PY

      # ============================================================
      # 10. Verify everything before build
      # ============================================================
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Flutter"
          echo "======================================"

          flutter --version

          echo ""
          echo "======================================"
          echo "Java"
          echo "======================================"

          java -version

          echo ""
          echo "======================================"
          echo "Gradle Wrapper"
          echo "======================================"

          test -f android/gradlew
          chmod +x android/gradlew

          android/gradlew --version

          echo ""
          echo "======================================"
          echo "compileSdk"
          echo "======================================"

          grep -nE \
            "compileSdk|compileSdkVersion" \
            android/app/build.gradle

          echo ""
          echo "======================================"
          echo "Android SDK 34"
          echo "======================================"

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

          echo "Android SDK 34: OK"

      # ============================================================
      # 11. Build APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # ============================================================
      # 12. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "BUILD SUCCESS"
          echo "======================================"

          ls -lh "$APK"

      # ============================================================
      # 13. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cine-remote-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
