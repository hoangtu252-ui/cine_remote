name: Build Cine Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ============================================================
      # 4. Check versions
      # ============================================================
      - name: Check versions
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo "===== Dart ====="
          dart --version

          echo "===== Java ====="
          java -version

      # ============================================================
      # 5. Upgrade Kotlin
      # ============================================================
      - name: Upgrade Kotlin version
        run: |
          echo "===== Kotlin before ====="
          grep -R "kotlin_version" android/build.gradle || true

          sed -i \
            "s/ext.kotlin_version = '1.6.10'/ext.kotlin_version = '1.7.10'/" \
            android/build.gradle

          echo "===== Kotlin after ====="
          grep -R "kotlin_version" android/build.gradle || true

      # ============================================================
      # 6. Remove Firebase from Dart
      # ============================================================
      - name: Remove Firebase from Dart
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/dependencies.dart")
          text = path.read_text()

          # Remove imports
          text = text.replace(
              "import 'package:firebase_core/firebase_core.dart';\n",
              ""
          )

          text = text.replace(
              "import 'package:firebase_crashlytics/firebase_crashlytics.dart';\n",
              ""
          )

          text = text.replace(
              "import 'firebase_options.dart';\n",
              ""
          )

          # Remove Firebase initialization
          text = text.replace(
              "  await setupFirebase();\n"
              "  setupCrashReporting();\n\n",
              ""
          )

          # Remove setupFirebase()
          start = text.find("Future<void> setupFirebase() async {")
          if start != -1:
              end = text.find("\n}\n", start)
              if end != -1:
                  text = text[:start] + text[end + 3:]

          # Remove setupCrashReporting()
          start = text.find("void setupCrashReporting() {")
          if start != -1:
              end = text.find("\n}\n", start)
              if end != -1:
                  text = text[:start] + text[end + 3:]

          path.write_text(text)
          PY

          echo "===== Remaining Firebase references ====="
          grep -nEi "firebase|Firebase" lib/dependencies.dart || true

      # ============================================================
      # 7. Disable Google Services Gradle plugin
      # ============================================================
      - name: Disable Google Services plugin
        run: |
          echo "===== Before ====="

          echo "--- android/build.gradle ---"
          grep -nEi "google-services|google.gms" \
            android/build.gradle || true

          echo "--- android/app/build.gradle ---"
          grep -nEi "google-services|google.gms" \
            android/app/build.gradle || true

          # Remove Google Services plugin application
          sed -i "/com.google.gms.google-services/d" \
            android/app/build.gradle

          # Remove Google Services dependency
          sed -i "/com.google.gms:google-services/d" \
            android/build.gradle

          echo "===== After ====="

          echo "--- android/build.gradle ---"
          grep -nEi "google-services|google.gms" \
            android/build.gradle || true

          echo "--- android/app/build.gradle ---"
          grep -nEi "google-services|google.gms" \
            android/app/build.gradle || true

      # ============================================================
      # 8. Flutter dependencies
      # ============================================================
      - name: Flutter Clean
        run: |
          flutter clean

      - name: Flutter Pub Get
        run: |
          flutter pub get

      # ============================================================
      # 9. Verify Firebase references
      # ============================================================
      - name: Verify Firebase is disabled
        run: |
          echo "===== Firebase references in lib ====="

          grep -RniE \
            "firebase_core|firebase_crashlytics|FirebaseCrashlytics|Firebase.initializeApp|DefaultFirebaseOptions" \
            lib || true

          echo "===== Google Services references ====="

          grep -RniE \
            "google-services|com.google.gms" \
            android || true

      # ============================================================
      # 10. Build ARM64 APK
      # ============================================================
      - name: Build ARM64 APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      # ============================================================
      # 11. Prepare APK
      # ============================================================
      - name: Prepare APK
        run: |
          mkdir -p artifacts

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            artifacts/cine-remote-arm64.apk

          echo "===== APK ====="
          ls -lh artifacts/cine-remote-arm64.apk

      # ============================================================
      # 12. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cine-remote-arm64
          path: artifacts/cine-remote-arm64.apk
          if-no-files-found: error
