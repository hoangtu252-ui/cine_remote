name: Build Cine Remote APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Flutter 3.27.4
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ============================================================
      # 4. Android SDK 34
      # ============================================================
      - name: Setup Android SDK 34
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=""

          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

          echo "Installed Android platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo "Installed Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

      # ============================================================
      # 5. Inspect Android project
      # ============================================================
      - name: Inspect Android configuration
        shell: bash
        run: |
          echo "========== android/app/build.gradle =========="
          cat android/app/build.gradle

          echo ""
          echo "========== android/build.gradle =========="
          cat android/build.gradle

          echo ""
          echo "========== android/settings.gradle =========="
          cat android/settings.gradle

      # ============================================================
      # 6. Fix old Kotlin version
      # ============================================================
      - name: Fix Kotlin version
        shell: bash
        run: |
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '1.6.10'/ext.kotlin_version = '1.7.10'/g" \
              android/build.gradle
          fi

          echo "Kotlin configuration:"
          grep -n "kotlin_version" android/build.gradle || true

      # ============================================================
      # 7. Force compileSdk 34
      # ============================================================
      - name: Force compileSdk 34
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("android/app/build.gradle not found")

          text = path.read_text()

          # compileSdkVersion flutter.compileSdkVersion
          # compileSdkVersion 35
          # compileSdkVersion = flutter.compileSdkVersion
          text = re.sub(
              r'compileSdkVersion\s*(?:=)?\s*[^\n]+',
              'compileSdkVersion 34',
              text
          )

          # compileSdk = flutter.compileSdkVersion
          # compileSdk = 35
          text = re.sub(
              r'compileSdk\s*=\s*[^\n]+',
              'compileSdk = 34',
              text
          )

          # compileSdk 35
          text = re.sub(
              r'compileSdk\s+[^\n]+',
              'compileSdk 34',
              text
          )

          path.write_text(text)

          print("Updated android/app/build.gradle")
          PY

          echo ""
          echo "========== compileSdk verification =========="
          grep -nE "compileSdk|compileSdkVersion" android/app/build.gradle || true

          echo ""
          echo "========== android-35 references =========="
          grep -Rni "android-35\|compileSdk.*35" android \
            --exclude-dir=.gradle \
            --exclude-dir=build || true

      # ============================================================
      # 8. Remove Firebase initialization from Dart
      # ============================================================
      - name: Remove Firebase runtime initialization
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/dependencies.dart")

          if not path.exists():
              print("dependencies.dart not found - skipping")
              raise SystemExit(0)

          text = path.read_text()

          # Remove Firebase imports
          text = re.sub(
              r"import 'package:firebase_core/firebase_core\.dart';\n",
              "",
              text
          )

          text = re.sub(
              r"import 'package:firebase_crashlytics/firebase_crashlytics\.dart';\n",
              "",
              text
          )

          # Remove firebase_options.dart
          text = re.sub(
              r"import 'firebase_options\.dart';\n",
              "",
              text
          )

          # Remove setupFirebase()
          text = re.sub(
              r"Future<void> setupFirebase\(\) async \{.*?\n\}\n",
              "",
              text,
              flags=re.S
          )

          # Remove setupCrashReporting()
          text = re.sub(
              r"void setupCrashReporting\(\) \{.*?\n\}\n",
              "",
              text,
              flags=re.S
          )

          # Remove calls from setup()
          text = text.replace(
              "  await setupFirebase();\n",
              ""
          )

          text = text.replace(
              "  setupCrashReporting();\n",
              ""
          )

          path.write_text(text)

          print("Firebase runtime initialization removed.")
          PY

          echo ""
          echo "========== Firebase references in dependencies.dart =========="
          grep -n "firebase\|Firebase" lib/dependencies.dart || true

      # ============================================================
      # 9. Disable Google Services plugin
      # ============================================================
      - name: Disable Google Services
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # android/app/build.gradle
          path = Path("android/app/build.gradle")

          if path.exists():
              text = path.read_text()

              # Remove Google Services apply statements
              text = re.sub(
                  r"^\s*apply plugin:\s*['\"]com\.google\.gms\.google-services['\"]\s*$",
                  "",
                  text,
                  flags=re.M
              )

              path.write_text(text)

          # android/build.gradle
          path = Path("android/build.gradle")

          if path.exists():
              text = path.read_text()

              # Remove Google Services classpath
              text = re.sub(
                  r"^\s*classpath\s+['\"]com\.google\.gms:google-services:[^'\"]+['\"]\s*$",
                  "",
                  text,
                  flags=re.M
              )

              path.write_text(text)
          PY

          echo "Google Services plugin disabled."

          grep -Rni "google-services\|google_services" android \
            --exclude-dir=.gradle \
            --exclude-dir=build || true

      # ============================================================
      # 10. Flutter dependencies
      # ============================================================
      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      # ============================================================
      # 11. Final Android configuration verification
      # ============================================================
      - name: Verify build configuration
        shell: bash
        run: |
          set -e

          echo "========== Flutter =========="
          flutter --version

          echo ""
          echo "========== Java =========="
          java -version

          echo ""
          echo "========== compileSdk =========="
          grep -nE "compileSdk|compileSdkVersion" android/app/build.gradle

          echo ""
          echo "========== Android SDK 34 =========="
          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          echo "Android SDK 34 OK"

          echo ""
          echo "========== Build Tools 34 =========="
          test -d "$ANDROID_SDK_ROOT/build-tools/34.0.0"
          echo "Build Tools 34.0.0 OK"

          echo ""
          echo "========== Google Services =========="
          if grep -Rni "google-services" android \
            --exclude-dir=.gradle \
            --exclude-dir=build; then
            echo "WARNING: Google Services references still exist."
          else
            echo "Google Services disabled."
          fi

      # ============================================================
      # 12. Build APK
      # ============================================================
      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      # ============================================================
      # 13. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cine-remote-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
