name: Build Cine Remote APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ============================================================
      # 4. Find Android SDK manager
      # ============================================================
      - name: Find sdkmanager
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"

          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" >> "$GITHUB_ENV"

          elif [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$ANDROID_SDK_ROOT/tools/bin/sdkmanager" >> "$GITHUB_ENV"

          else
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

      # ============================================================
      # 5. Install Android SDK 34
      # ============================================================
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -e

          echo "Using SDK manager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo ""
          echo "Installed platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo ""
          echo "Installed build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

      # ============================================================
      # 6. Flutter pub get
      #
      # IMPORTANT:
      # Flutter may upgrade old Android Gradle files here.
      # Therefore compileSdk is NOT patched before this step.
      # ============================================================
      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      # ============================================================
      # 7. Force compileSdk = 34 AFTER Flutter pub get
      # ============================================================
      - name: Force Android compileSdk 34
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("android/app/build.gradle not found")

          text = path.read_text()

          # Original Cine Remote:
          # compileSdkVersion flutter.compileSdkVersion
          text = re.sub(
              r'(?m)^(\s*)compileSdkVersion\s+.*$',
              r'\g<1>compileSdkVersion 34',
              text
          )

          # New Gradle syntax:
          # compileSdk = flutter.compileSdkVersion
          text = re.sub(
              r'(?m)^(\s*)compileSdk\s*=\s*.*$',
              r'\g<1>compileSdk = 34',
              text
          )

          # New Gradle syntax:
          # compileSdk 35
          text = re.sub(
              r'(?m)^(\s*)compileSdk\s+\d+\s*$',
              r'\g<1>compileSdk 34',
              text
          )

          path.write_text(text)

          print("compileSdk patched to 34")
          PY

          echo ""
          echo "========== FINAL build.gradle =========="

          grep -nE "compileSdk|compileSdkVersion" \
            android/app/build.gradle

          echo ""
          echo "========== Check for flutter.compileSdkVersion =========="

          if grep -n "flutter.compileSdkVersion" android/app/build.gradle; then
            echo "ERROR: flutter.compileSdkVersion still exists!"
            exit 1
          fi

          echo ""
          echo "compileSdk is correctly fixed to Android 34."

      # ============================================================
      # 8. Remove Firebase initialization from dependencies.dart
      # ============================================================
      - name: Remove Firebase runtime initialization
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/dependencies.dart")

          if not path.exists():
              print("dependencies.dart not found")
              raise SystemExit(0)

          text = path.read_text()

          # Remove Firebase imports
          text = re.sub(
              r"import 'package:firebase_core/firebase_core\.dart';\n",
              "",
              text
          )

          text = re.sub(
              r"import 'package:firebase_crashlytics/firebase_crashlytics\.dart';\n",
              "",
              text
          )

          text = re.sub(
              r"import 'firebase_options\.dart';\n",
              "",
              text
          )

          # Remove setupFirebase()
          text = re.sub(
              r"Future<void> setupFirebase\(\) async \{.*?\n\}\n",
              "",
              text,
              flags=re.S
          )

          # Remove setupCrashReporting()
          text = re.sub(
              r"void setupCrashReporting\(\) \{.*?\n\}\n",
              "",
              text,
              flags=re.S
          )

          # Remove calls
          text = text.replace(
              "  await setupFirebase();\n",
              ""
          )

          text = text.replace(
              "  setupCrashReporting();\n",
              ""
          )

          path.write_text(text)

          print("Firebase runtime initialization removed.")
          PY

      # ============================================================
      # 9. Disable Google Services Gradle plugin
      # ============================================================
      - name: Disable Google Services
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          # app/build.gradle
          path = Path("android/app/build.gradle")

          if path.exists():
              text = path.read_text()

              text = re.sub(
                  r"(?m)^\s*apply plugin:\s*['\"]com\.google\.gms\.google-services['\"]\s*\n?",
                  "",
                  text
              )

              text = re.sub(
                  r"(?m)^\s*apply plugin:\s*['\"]com\.google\.firebase\.crashlytics['\"]\s*\n?",
                  "",
                  text
              )

              path.write_text(text)

          # android/build.gradle
          path = Path("android/build.gradle")

          if path.exists():
              text = path.read_text()

              text = re.sub(
                  r"(?m)^\s*classpath\s+['\"]com\.google\.gms:google-services:[^'\"]+['\"]\s*\n?",
                  "",
                  text
              )

              text = re.sub(
                  r"(?m)^\s*classpath\s+['\"]com\.google\.firebase:firebase-crashlytics-gradle:[^'\"]+['\"]\s*\n?",
                  "",
                  text
              )

              path.write_text(text)

          print("Google Services / Crashlytics Gradle plugins disabled.")
          PY

      # ============================================================
      # 10. Verify configuration BEFORE Gradle
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Flutter"
          echo "=========================================="
          flutter --version

          echo ""
          echo "=========================================="
          echo "Java"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo "compileSdk"
          echo "=========================================="
          grep -nE "compileSdk|compileSdkVersion" \
            android/app/build.gradle

          echo ""
          echo "=========================================="
          echo "Android SDK 34"
          echo "=========================================="

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

          echo "Android SDK 34: OK"

          echo ""
          echo "=========================================="
          echo "Build Tools 34"
          echo "=========================================="

          test -d \
            "$ANDROID_SDK_ROOT/build-tools/34.0.0"

          echo "Build Tools 34.0.0: OK"

          echo ""
          echo "=========================================="
          echo "Google Services references"
          echo "=========================================="

          grep -Rni \
            "google-services\|firebase-crashlytics" \
            android \
            --exclude-dir=.gradle \
            --exclude-dir=build || true

      # ============================================================
      # 11. Gradle build
      #
      # IMPORTANT:
      # Do NOT use "flutter build apk" here.
      #
      # flutter build may upgrade old Gradle files again.
      # We call Gradle directly after compileSdk is fixed.
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # ============================================================
      # 12. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching APK..."

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -f \
            android/app/build/outputs/apk/release/app-release.apk

          echo ""
          echo "=========================================="
          echo "APK BUILD SUCCESS"
          echo "=========================================="

          ls -lh \
            android/app/build/outputs/apk/release/app-release.apk

      # ============================================================
      # 13. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cine-remote-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
