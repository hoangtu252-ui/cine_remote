name: Build Cine Remote APK - Mi Pad 6S Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-mi-pad-6s-pro.yml"

permissions:
  contents: read

concurrency:
  group: cine-remote-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.27.4"
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_TARGET_SDK: "34"
  ANDROID_MIN_SDK: "21"
  APK_NAME: "cine-remote-mi-pad-6s-pro-arm64.apk"

jobs:
  build-apk:
    name: Build ARM64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          dart --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;34.0.0"

      - name: Patch legacy Android project for current dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          compile_sdk = os.environ["ANDROID_COMPILE_SDK"]
          target_sdk = os.environ["ANDROID_TARGET_SDK"]
          min_sdk = os.environ["ANDROID_MIN_SDK"]

          # ------------------------------------------------------------------
          # 1) network_info_plus 6.1.x requires:
          #    Java 17, AGP >= 8.3.0 and Gradle >= 8.4.
          #    The upstream project still has AGP 7.1.2 / Gradle 7.4.
          # ------------------------------------------------------------------
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = wrapper.read_text()
          text = re.sub(
              r"distributionUrl=.*gradle-[0-9.]+-(?:all|bin)\.zip",
              r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip",
              text,
          )
          wrapper.write_text(text)

          root_gradle = Path("android/build.gradle")
          text = root_gradle.read_text()
          text = re.sub(
              r"ext\.kotlin_version\s*=\s*'[^']+'",
              "ext.kotlin_version = '1.9.22'",
              text,
          )
          text = re.sub(
              r"classpath\s+'com\.android\.tools\.build:gradle:[^']+'",
              "classpath 'com.android.tools.build:gradle:8.3.1'",
              text,
          )

          # Upstream intentionally does not commit Firebase config files.
          # For a sideload build, remove Gradle-side Firebase/Crashlytics plugins.
          text = re.sub(
              r"^\s*classpath\s+'com\.google\.gms:google-services:[^']+'\s*$\n?",
              "",
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r"^\s*classpath\s+'com\.google\.firebase:firebase-crashlytics-gradle:[^']+'\s*$\n?",
              "",
              text,
              flags=re.MULTILINE,
          )
          root_gradle.write_text(text)

          app_gradle = Path("android/app/build.gradle")
          text = app_gradle.read_text()

          text = re.sub(
              r"^\s*apply plugin:\s*'com\.google\.gms\.google-services'\s*$\n?",
              "",
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r"^\s*apply plugin:\s*'com\.google\.firebase\.crashlytics'\s*$\n?",
              "",
              text,
              flags=re.MULTILINE,
          )

          # AGP 8 requires an explicit namespace.
          if not re.search(r"^\s*namespace\s+", text, flags=re.MULTILINE):
              text = text.replace(
                  "android {\n",
                  'android {\n    namespace "com.julianschroden.cine_remote"\n',
                  1,
              )

          # Pin Android levels for a stable sideload build.
          text = re.sub(
              r"compileSdkVersion\s+flutter\.compileSdkVersion",
              f"compileSdkVersion {compile_sdk}",
              text,
          )
          text = re.sub(
              r"minSdkVersion\s+\d+",
              f"minSdkVersion {min_sdk}",
              text,
          )
          text = re.sub(
              r"targetSdkVersion\s+flutter\.targetSdkVersion",
              f"targetSdkVersion {target_sdk}",
              text,
          )

          # Java/Kotlin 17 is required by network_info_plus 6.x.
          text = text.replace(
              "sourceCompatibility JavaVersion.VERSION_1_8",
              "sourceCompatibility JavaVersion.VERSION_17",
          )
          text = text.replace(
              "targetCompatibility JavaVersion.VERSION_1_8",
              "targetCompatibility JavaVersion.VERSION_17",
          )
          text = re.sub(
              r"jvmTarget\s*=\s*['\"]1\.8['\"]",
              "jvmTarget = '17'",
              text,
          )

          app_gradle.write_text(text)

          # Give Gradle more headroom on GitHub-hosted runner.
          gradle_props = Path("android/gradle.properties")
          text = gradle_props.read_text()
          text = re.sub(
              r"org\.gradle\.jvmargs=.*",
              "org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8",
              text,
          )
          gradle_props.write_text(text)

          # ------------------------------------------------------------------
          # 2) Release networking:
          #    The upstream main manifest has no INTERNET permission.
          #    EosCineHttp cameras also need local cleartext HTTP to be allowed.
          # ------------------------------------------------------------------
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          # AGP 8 uses namespace from build.gradle.
          text = re.sub(
              r'\s+package="com\.julianschroden\.cine_remote"',
              "",
              text,
              count=1,
          )

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  ">",
                  '>\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  1,
              )

          if "android:usesCleartextTraffic=" not in text:
              text = text.replace(
                  'android:icon="@mipmap/ic_launcher">',
                  'android:icon="@mipmap/ic_launcher"\n'
                  '        android:usesCleartextTraffic="true">',
                  1,
              )

          manifest.write_text(text)

          # ------------------------------------------------------------------
          # 3) Firebase:
          #    lib/firebase_options.dart is ignored upstream, so a clean fork
          #    cannot compile as-is. For this sideload APK we disable Firebase
          #    initialization/Crashlytics only; camera-control functionality
          #    remains intact.
          # ------------------------------------------------------------------
          deps = Path("lib/dependencies.dart")
          text = deps.read_text()
          text = re.sub(
              r"\n\s*await setupFirebase\(\);\s*\n\s*setupCrashReporting\(\);\s*\n",
              "\n  // Firebase/Crashlytics disabled for local sideload build.\n",
              text,
              count=1,
          )
          deps.write_text(text)

          firebase_options = Path("lib/firebase_options.dart")
          firebase_options.write_text(
              """// CI-only stub. Firebase initialization is disabled in this build.
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'unused',
                  appId: '1:1:android:0000000000000000000000',
                  messagingSenderId: '1',
                  projectId: 'cine-remote-local',
                );
          }
          """
          )

          print("Android project patched successfully.")
          PY

      - name: Show effective Android configuration
        shell: bash
        run: |
          set -euxo pipefail
          grep -nE \
            "kotlin_version|com.android.tools.build:gradle" \
            android/build.gradle

          grep -nE \
            "namespace|compileSdkVersion|minSdkVersion|targetSdkVersion|VERSION_17|jvmTarget" \
            android/app/build.gradle

          grep -nE \
            "INTERNET|usesCleartextTraffic" \
            android/app/src/main/AndroidManifest.xml

          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean
          flutter pub get

      - name: Verify Gradle
        shell: bash
        working-directory: android
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --version

      - name: Build ARM64 release APK for Mi Pad 6S Pro
        shell: bash
        run: |
          set -euxo pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Collect APK and checksum
        id: artifact
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          APK_PATH="$(find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name '*arm64-v8a*release*.apk' \
            | head -n 1)"

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ARM64 release APK was not found."
            find build/app/outputs -type f -maxdepth 5 -print || true
            exit 1
          fi

          cp "$APK_PATH" "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"

          ls -lh dist/
          echo "apk_path=dist/$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Mi Pad 6S Pro APK
        uses: actions/upload-artifact@v7
        with:
          name: cine-remote-mi-pad-6s-pro-arm64
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
