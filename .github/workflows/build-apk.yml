name: Build Cine Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Check versions
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo "===== Dart ====="
          dart --version

          echo "===== Java ====="
          java -version

      - name: Upgrade Kotlin
        run: |
          echo "===== Kotlin before ====="
          grep -R "kotlin_version" android/build.gradle || true

          sed -i "s/ext.kotlin_version = '1.6.10'/ext.kotlin_version = '1.7.10'/" android/build.gradle

          echo "===== Kotlin after ====="
          grep -R "kotlin_version" android/build.gradle || true

      - name: Remove Firebase dependencies
        run: |
          echo "===== Removing Firebase from dependencies.dart ====="

          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/dependencies.dart")
          text = path.read_text()

          # Remove Firebase imports
          text = text.replace(
              "import 'package:firebase_core/firebase_core.dart';\n",
              ""
          )

          text = text.replace(
              "import 'package:firebase_crashlytics/firebase_crashlytics.dart';\n",
              ""
          )

          # Remove firebase_options import
          text = text.replace(
              "import 'firebase_options.dart';\n",
              ""
          )

          # Remove Firebase initialization from setup()
          text = text.replace(
              "  await setupFirebase();\n"
              "  setupCrashReporting();\n\n",
              ""
          )

          # Replace setupFirebase() function
          start = text.find("Future<void> setupFirebase() async {")
          if start != -1:
              end = text.find("\n}\n", start)
              if end != -1:
                  text = text[:start] + text[end + 3:]

          # Remove setupCrashReporting() function
          start = text.find("void setupCrashReporting() {")
          if start != -1:
              end = text.find("\n}\n", start)
              if end != -1:
                  text = text[:start] + text[end + 3:]

          path.write_text(text)
          PY

          echo "===== Firebase references after modification ====="
          grep -n "firebase\|Firebase" lib/dependencies.dart || true

          echo "===== dependencies.dart ====="
          sed -n '1,180p' lib/dependencies.dart

      - name: Flutter Clean
        run: |
          flutter clean

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Check Firebase references
        run: |
          echo "===== Firebase references in lib ====="
          grep -RniE "firebase_core|firebase_crashlytics|FirebaseCrashlytics|Firebase.initializeApp|DefaultFirebaseOptions" lib || true

      - name: Build ARM64 APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Prepare APK
        run: |
          mkdir -p artifacts

          cp build/app/outputs/flutter-apk/app-release.apk \
             artifacts/cine-remote-arm64.apk

          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cine-remote-arm64
          path: artifacts/cine-remote-arm64.apk
          if-no-files-found: error
