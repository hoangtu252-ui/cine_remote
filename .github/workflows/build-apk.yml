name: Build Cine Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. Flutter 3.27.4
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ============================================================
      # 4. Check environment
      # ============================================================
      - name: Check environment
        run: |
          echo "========================================"
          echo "Flutter"
          echo "========================================"
          flutter --version

          echo "========================================"
          echo "Dart"
          echo "========================================"
          dart --version

          echo "========================================"
          echo "Java"
          echo "========================================"
          java -version

          echo "========================================"
          echo "Android SDK"
          echo "========================================"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          flutter config --list

      # ============================================================
      # 5. Locate Android SDK tools
      # ============================================================
      - name: Locate Android SDK tools
        run: |
          echo "========================================"
          echo "Searching for sdkmanager"
          echo "========================================"

          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "SDK_PATH=$SDK_PATH"

          if [ -x "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Found:"
            echo "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_PATH/cmdline-tools/bin/sdkmanager" ]; then
            echo "Found:"
            echo "$SDK_PATH/cmdline-tools/bin/sdkmanager"
          elif [ -x "$SDK_PATH/tools/bin/sdkmanager" ]; then
            echo "Found:"
            echo "$SDK_PATH/tools/bin/sdkmanager"
          else
            echo "sdkmanager not found."
            find "$SDK_PATH" -name sdkmanager -type f 2>/dev/null || true
          fi

      # ============================================================
      # 6. Install Android SDK 32
      # ============================================================
      - name: Install Android SDK 32
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          if [ -x "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_PATH/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/cmdline-tools/bin/sdkmanager"
          elif [ -x "$SDK_PATH/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/tools/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-32" \
            "build-tools;32.0.0"

          echo "========================================"
          echo "Android SDK 32 installed"
          echo "========================================"

          ls -la "$SDK_PATH/platforms/android-32" || true
          ls -la "$SDK_PATH/build-tools/32.0.0" || true

      # ============================================================
      # 7. Upgrade Kotlin
      # ============================================================
      - name: Upgrade Kotlin
        run: |
          echo "========================================"
          echo "Kotlin BEFORE"
          echo "========================================"

          grep -R "kotlin_version" \
            android/build.gradle || true

          sed -i \
            "s/ext.kotlin_version = '1.6.10'/ext.kotlin_version = '1.7.10'/" \
            android/build.gradle

          echo "========================================"
          echo "Kotlin AFTER"
          echo "========================================"

          grep -R "kotlin_version" \
            android/build.gradle || true

      # ============================================================
      # 8. Force compileSdk 32
      # ============================================================
      - name: Fix compileSdk
        run: |
          echo "========================================"
          echo "Android configuration BEFORE"
          echo "========================================"

          grep -nE \
            "compileSdk|compileSdkVersion|targetSdk|minSdk" \
            android/app/build.gradle || true

          sed -i -E \
            's/compileSdkVersion [0-9]+/compileSdkVersion 32/g' \
            android/app/build.gradle

          sed -i -E \
            's/compileSdk [0-9]+/compileSdk 32/g' \
            android/app/build.gradle

          echo "========================================"
          echo "Android configuration AFTER"
          echo "========================================"

          grep -nE \
            "compileSdk|compileSdkVersion|targetSdk|minSdk" \
            android/app/build.gradle || true

      # ============================================================
      # 9. Remove Firebase initialization
      # ============================================================
      - name: Remove Firebase initialization
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/dependencies.dart")

          if not path.exists():
              print("dependencies.dart not found")
              raise SystemExit(0)

          text = path.read_text()

          # Firebase imports
          text = text.replace(
              "import 'package:firebase_core/firebase_core.dart';\n",
              ""
          )

          text = text.replace(
              "import 'package:firebase_crashlytics/firebase_crashlytics.dart';\n",
              ""
          )

          text = text.replace(
              "import 'firebase_options.dart';\n",
              ""
          )

          # Firebase setup calls
          text = text.replace(
              "  await setupFirebase();\n"
              "  setupCrashReporting();\n\n",
              ""
          )

          # Remove setupFirebase()
          start = text.find(
              "Future<void> setupFirebase() async {"
          )

          if start != -1:
              end = text.find("\n}\n", start)
              if end != -1:
                  text = text[:start] + text[end + 3:]

          # Remove setupCrashReporting()
          start = text.find(
              "void setupCrashReporting() {"
          )

          if start != -1:
              end = text.find("\n}\n", start)
              if end != -1:
                  text = text[:start] + text[end + 3:]

          path.write_text(text)

          print("Firebase initialization removed.")
          PY

      # ============================================================
      # 10. Disable Google Services plugin
      # ============================================================
      - name: Disable Google Services
        run: |
          echo "========================================"
          echo "Google Services BEFORE"
          echo "========================================"

          grep -RniE \
            "google-services|com.google.gms" \
            android || true

          sed -i \
            "/com.google.gms.google-services/d" \
            android/app/build.gradle || true

          sed -i \
            "/com.google.gms:google-services/d" \
            android/build.gradle || true

          echo "========================================"
          echo "Google Services AFTER"
          echo "========================================"

          grep -RniE \
            "google-services|com.google.gms" \
            android || true

      # ============================================================
      # 11. Flutter clean
      # ============================================================
      - name: Flutter Clean
        run: |
          flutter clean

      # ============================================================
      # 12. Flutter dependencies
      # ============================================================
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # ============================================================
      # 13. Verify configuration
      # ============================================================
      - name: Verify configuration
        run: |
          echo "========================================"
          echo "compileSdk"
          echo "========================================"

          grep -nE \
            "compileSdk|compileSdkVersion" \
            android/app/build.gradle || true

          echo "========================================"
          echo "Kotlin"
          echo "========================================"

          grep -n \
            "kotlin_version" \
            android/build.gradle || true

          echo "========================================"
          echo "Firebase"
          echo "========================================"

          grep -RniE \
            "firebase_core|firebase_crashlytics|FirebaseCrashlytics|Firebase.initializeApp|DefaultFirebaseOptions" \
            lib || true

          echo "========================================"
          echo "Google Services"
          echo "========================================"

          grep -RniE \
            "google-services|com.google.gms" \
            android || true

      # ============================================================
      # 14. Build ARM64 APK
      # ============================================================
      - name: Build ARM64 APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      # ============================================================
      # 15. Prepare APK
      # ============================================================
      - name: Prepare APK
        run: |
          mkdir -p artifacts

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            artifacts/cine-remote-arm64.apk

          echo "========================================"
          echo "APK"
          echo "========================================"

          ls -lh \
            artifacts/cine-remote-arm64.apk

      # ============================================================
      # 16. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cine-remote-arm64
          path: artifacts/cine-remote-arm64.apk
          if-no-files-found: error
